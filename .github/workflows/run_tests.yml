name: run_tests

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'
  CARGO_INCREMENTAL: '0'
  RUSTUP_TOOLCHAIN: "1.98.1"
  RUSTFLAGS: "-C debuginfo=0"

on:
  push:
    branches: [ main, develop, 'release/**' ]
  pull_request:
    branches: [ main, develop, 'release/**' ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.ref_name == 'main' && github.sha || 'anysha' }}
  cancel-in-progress: true

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: false
          fetch-depth: ${{ github.ref == 'refs/heads/main' && 2 || 350 }}

      - id: filter
        name: Filter changed files
        run: |
          set -euo pipefail
          if [ -z "${GITHUB_BASE_REF:-}" ]; then
            echo "Not in a PR context (i.e., push event)"
            COMPARE_REV="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
          else
            echo "In a PR context comparing to pull_request.base.ref"
            git fetch origin "$GITHUB_BASE_REF" --depth=350
            COMPARE_REV="$(git merge-base "origin/${GITHUB_BASE_REF}" HEAD)"
          fi

          if [ "$COMPARE_REV" = "$GITHUB_SHA" ]; then
            CHANGED_FILES="$(git diff --name-only HEAD~1 "$GITHUB_SHA" 2>/dev/null || git ls-files)"
          else
            CHANGED_FILES="$(git diff --name-only "$COMPARE_REV" "$GITHUB_SHA")"
          fi

          check_pattern() {
            local output_name="$1"
            local pattern="$2"

            if echo "$CHANGED_FILES" | grep -qE "$pattern"; then
              echo "${output_name}=true" >> "$GITHUB_OUTPUT"
            else
              echo "${output_name}=false" >> "$GITHUB_OUTPUT"
            fi
          }

          check_pattern "check_rust" '^(rust-toolchain\.toml|devenv\.nix|Cargo\.lock|(.*/)?Cargo\.toml|.*\.rs|crates/converter/src/records/.*\.json|\.cargo/.*|\.github/workflows/.*)$'
          check_pattern "check_scripts" '(\.(ps1|py)$|^scripts/[^/]*\.sh$|^scripts/lod-experiment/|^tools/record_comparison/|^docs/research/lod-acceptance-20261005/|^\.github/workflows/run_tests\.yml$)'
          check_pattern "check_lod_experiment" '^(scripts/lod-experiment/|\.github/workflows/run_tests\.yml$)'
          check_pattern "check_native_profiling" '^(scripts/profiling/(analyze_native\.py|correlate_drawables\.py|metal_trace\.m|source-manifest\.json|fixtures/.*\.json)|scripts/tests/test_native_metal_profiling\.py|\.github/workflows/run_tests\.yml)$'
          check_pattern "check_z_fighting_audit" '^(scripts/audit-z-fighting\.py|scripts/tests/test_audit_z_fighting\.py|\.github/workflows/run_tests\.yml)$'
          check_pattern "check_enable_observations" '^(scripts/reference-enable-observations\.py|scripts/tests/test_reference_enable_observations\.py|\.github/workflows/run_tests\.yml)$'
          check_pattern "check_schema_validation" '^(tools/schema_validation/|\.github/workflows/run_tests\.yml$)'
    outputs:
      check_rust: ${{ steps.filter.outputs.check_rust }}
      check_scripts: ${{ steps.filter.outputs.check_scripts }}
      check_lod_experiment: ${{ steps.filter.outputs.check_lod_experiment }}
      check_native_profiling: ${{ steps.filter.outputs.check_native_profiling }}
      check_z_fighting_audit: ${{ steps.filter.outputs.check_z_fighting_audit }}
      check_enable_observations: ${{ steps.filter.outputs.check_enable_observations }}
      check_schema_validation: ${{ steps.filter.outputs.check_schema_validation }}

  format:
    needs: [orchestrate]
    if: needs.orchestrate.outputs.check_rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Install Rustfmt
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          components: rustfmt

      - name: Format check
        run: cargo fmt --all -- --check

  scripts:
    needs: [orchestrate]
    if: needs.orchestrate.outputs.check_scripts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Test repeated terrain startup runner
        run: python3 -m unittest discover -s scripts/tests -p test_repeat_terrain_startup.py -v

      - name: Test Riverwood LOD capture gates
        run: python3 -m unittest discover -s scripts/tests -p test_capture_riverwood_lod.py -v

      - name: Test Skyrim capture, replay and comparison helpers
        run: python3 -B -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Test Riverwood asset reuse audit
        run: python3 -B -m unittest discover -s scripts/tests -p test_audit_riverwood_reuse.py -v

      - name: Test phase 1 LOD capture
        run: python3 -B -m unittest discover -s scripts/tests -p test_capture_lod_phase1.py -v

      - name: Test tonemap tuning capture evidence
        run: python3 -B -m unittest discover -s scripts/tests -p test_capture_tonemap_tuning.py -v

      - name: Test streaming comparison analysis
        run: python3 -B -m unittest discover -s scripts/tests -p test_streaming_comparison_analysis.py -v

      - name: Test streaming comparison runner
        run: python3 -B -m unittest discover -s scripts/tests -p test_streaming_comparison_runner.py -v

      - name: Test recorded comparison value matching
        run: python3 -B -m unittest discover -s tools/record_comparison -p 'test_*.py' -v

      - name: Test cluster bounds audit lockfile parsing
        run: python3 -B -m unittest discover -s tools -p 'test_diagnose_cluster_bounds.py' -v

      - name: Test Windows installer checksum handling
        run: pwsh -NoProfile -File scripts/tests/test_install_checksum.ps1

      - name: PowerShell scripts with non-ASCII text keep a UTF-8 BOM
        run: |
          set -euo pipefail
          failed=0
          while IFS= read -r file; do
            if [ "$(LC_ALL=C tr -d '\0-\177' <"$file" | wc -c)" -gt 0 ] \
              && [ "$(head -c 3 "$file" | od -An -tx1 | tr -d ' \n')" != "efbbbf" ]; then
              echo "::error file=$file::$file contains non-ASCII text but no UTF-8 BOM; Windows PowerShell 5.1 would misread it"
              failed=1
            fi
          done < <(git ls-files '*.ps1')
          exit "$failed"

      - name: Verify LOD acceptance summary checks
        run: python3 -m unittest discover -s scripts/tests -p test_lod_acceptance_summary.py -v

      - name: Verify stage receipt comparison
        run: python3 -m unittest discover -s scripts/tests -p test_compare_stage_receipts.py -v

      - name: Verify cluster timing receipt validation
        run: python3 -B -m unittest discover -s scripts/tests -p test_cluster_timing_receipt.py -v

      - name: Verify terrain LOD helper commands
        run: python3 -m unittest discover -s scripts/lod-performance -p test_helpers.py -v

      - name: Build and verify pinned object LOD experiment
        if: needs.orchestrate.outputs.check_lod_experiment == 'true'
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v1.3 https://github.com/zeux/meshoptimizer.git "$RUNNER_TEMP/meshoptimizer"
          python3 scripts/lod-experiment/build.py --meshoptimizer "$RUNNER_TEMP/meshoptimizer" --output "$RUNNER_TEMP/lod-builder"
          LOD_EXPERIMENT_BUILDER="$RUNNER_TEMP/lod-builder" python3 -m unittest discover -s scripts/lod-experiment/tests -p 'test_*.py' -v

  native_profiling:
    needs: [orchestrate]
    if: needs.orchestrate.outputs.check_native_profiling == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test native trace analyzers and camera fixtures
        run: python3 -m unittest discover -s scripts/tests -p test_native_metal_profiling.py -v

  z_fighting_audit:
    needs: [orchestrate]
    if: needs.orchestrate.outputs.check_z_fighting_audit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test static depth-risk audit
        run: python3 -m unittest discover -s scripts/tests -p test_audit_z_fighting.py -v

  enable_observations:
    needs: [orchestrate]
    if: needs.orchestrate.outputs.check_enable_observations == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Test reference observation input preservation
        run: python3 -m unittest discover -s scripts/tests -p test_reference_enable_observations.py -v

  schema_validation:
    needs: [orchestrate]
    if: needs.orchestrate.outputs.check_schema_validation == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: macos-latest
            python: '3.11'
          - os: windows-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Test standalone schema evidence tools
        run: python -B -m unittest discover -s tools/schema_validation -p 'test_*.py' -v

  clippy:
    needs: [orchestrate]
    if: needs.orchestrate.outputs.check_rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libudev-dev \
            libwayland-dev \
            libxkbcommon-dev \
            pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          components: clippy

      - name: Set up mold linker
        uses: rui314/setup-mold@v1

      - name: Setup kache compiler cache
        uses: kunobi-ninja/kache-action@v1

      - name: Clippy check
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    needs: [orchestrate]
    if: needs.orchestrate.outputs.check_rust == 'true'
    runs-on: ubuntu-latest
    # Cold test builds can take 26 minutes; leave time for the full suite.
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libudev-dev \
            libwayland-dev \
            libxkbcommon-dev \
            mesa-vulkan-drivers \
            pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"

      - name: Set up mold linker
        uses: rui314/setup-mold@v1

      - name: Setup kache compiler cache
        uses: kunobi-ninja/kache-action@v1
        with:
          # Clippy and tests produce different artifacts. GitHub cache keys are
          # immutable, so the test build must not compete with Clippy's save.
          cache-key-prefix: kache-test

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Run unit & integration tests
        run: cargo nextest run --workspace --lib --bins --tests --examples --no-fail-fast --no-tests=warn
        env:
          NEXTEST_NO_TESTS: warn

      - name: Test GPU texture encoder on software Vulkan
        run: cargo nextest run --locked --workspace --lib --bins --tests --examples --run-ignored only -E 'test(v210_software_gpu_encodes_and_decodes_color_alpha_normals_and_mips) | test(gpu_authored_atlas_software_vulkan_preserves_mips_gutters_padding_and_slots)'
        env:
          WGPU_BACKEND: vulkan

  security:
    needs: [orchestrate]
    if: needs.orchestrate.outputs.check_rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Audit dependencies
        run: >-
          cargo audit
          --ignore RUSTSEC-2026-0194
          --ignore RUSTSEC-2026-0195

  performance:
    needs: [orchestrate]
    if: needs.orchestrate.outputs.check_rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"

      - name: Run release performance budgets
        run: cargo test --locked --release -p dummy-content --test performance -- --ignored --nocapture --test-threads=1
        env:
          # Fixture generation syncs every file. Keep runner disk-flush latency
          # out of the generator budgets without relaxing their thresholds.
          TMPDIR: /dev/shm

  tests_pass:
    needs:
      - orchestrate
      - format
      - scripts
      - native_profiling
      - z_fighting_audit
      - enable_observations
      - schema_validation
      - clippy
      - test
      - security
      - performance
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify overall pipeline status
        run: |
          EXIT_CODE=0

          check_result() {
            local job_name="$1"
            local result="$2"
            echo "* ${job_name}: ${result}"
            if [[ "$result" != "skipped" && "$result" != "success" ]]; then
              EXIT_CODE=1
            fi
          }

          check_result "orchestrate" "$RESULT_ORCHESTRATE"
          check_result "format" "$RESULT_FORMAT"
          check_result "scripts" "$RESULT_SCRIPTS"
          check_result "native_profiling" "$RESULT_NATIVE_PROFILING"
          check_result "z_fighting_audit" "$RESULT_Z_FIGHTING_AUDIT"
          check_result "enable_observations" "$RESULT_ENABLE_OBSERVATIONS"
          check_result "schema_validation" "$RESULT_SCHEMA_VALIDATION"
          check_result "clippy" "$RESULT_CLIPPY"
          check_result "test" "$RESULT_TEST"
          check_result "security" "$RESULT_SECURITY"
          check_result "performance" "$RESULT_PERFORMANCE"

          exit $EXIT_CODE
        env:
          RESULT_ORCHESTRATE: ${{ needs.orchestrate.result }}
          RESULT_FORMAT: ${{ needs.format.result }}
          RESULT_SCRIPTS: ${{ needs.scripts.result }}
          RESULT_NATIVE_PROFILING: ${{ needs.native_profiling.result }}
          RESULT_Z_FIGHTING_AUDIT: ${{ needs.z_fighting_audit.result }}
          RESULT_ENABLE_OBSERVATIONS: ${{ needs.enable_observations.result }}
          RESULT_SCHEMA_VALIDATION: ${{ needs.schema_validation.result }}
          RESULT_CLIPPY: ${{ needs.clippy.result }}
          RESULT_TEST: ${{ needs.test.result }}
          RESULT_SECURITY: ${{ needs.security.result }}
          RESULT_PERFORMANCE: ${{ needs.performance.result }}
