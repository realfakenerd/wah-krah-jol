[workspace]
resolver = "2"
members = [
    "crates/converter",
    "crates/dummy-content",
    "crates/engine",
    "crates/launcher",
    "crates/mo2",
    "crates/shared",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Mudcrab Team"]
license = "GPL-3.0-or-later"

[workspace.dependencies]
# Engine & Rendering
# Preserve Bevy's default capabilities while replacing its vulnerable Rust Zstd decoder.
# Recheck this feature expansion when upgrading Bevy.
bevy = { version = "0.19.0", default-features = false, features = [
    "2d", "ui", "audio",
    "common_api", "bevy_light", "bevy_mikktspace", "ktx2",
    "morph_animation", "morph", "smaa_luts", "tonemapping_luts",
    "bevy_render", "bevy_core_pipeline", "bevy_gizmos_render", "bevy_anti_alias",
    "bevy_gltf", "bevy_pbr", "bevy_post_process", "gltf_animation",
    "basis-universal", "pbr_specular_textures", "zstd_c",
] }

# Scripting & Database
mlua = { version = "0.10", features = ["luau", "luau-jit", "vendored"] }
rusqlite = { version = "0.41", features = ["bundled-full", "fallible_uint"] }
rkyv = { version = "0.8.18" }
memmap2 = "0.9"
crossbeam-channel = "0.5.16"

# Error Handling
color-eyre = "0.6.5"

# Converter Dependencies
mesh-tools = "0.4.0"
basis-universal = "0.3"
ddsfile = "0.5"
nom = "8.0.0"
nom-derive = "0.10.1"
tokio = { version = "1.47", features = ["fs", "macros", "rt-multi-thread", "sync"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
walkdir = "2.5"
lz4_flex = "0.11"
image_dds = { version = "0.7.2", default-features = false, features = ["ddsfile", "image"] }
ktx2 = "0.5"
project-wormhole-nif = { path = "vendor/project-wormhole-nif" }
project-wormhole-esm = "0.1.0"

# bevy_image 0.19.0 requires zstd ^0.13.3, which carries four RustSec advisories.
# The vendored copy changes only that requirement to 0.14, so the engine's KTX2
# decoder shares the fixed zstd with the converter. The advisories and the removal
# criteria are in vendor/bevy_image/README.mudcrab.md.
[patch.crates-io]
bevy_image = { path = "vendor/bevy_image" }

# Workspace profile optimization
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"

# Optimised builds for trying changes, not for measuring them: release without link-time
# optimisation and with the incremental cache, so a one-file edit relinks in well under a
# minute instead of several. Frame times are not comparable with `release`; benchmarks and
# acceptance runs keep `--release`. Usage: `cargo build --profile quick --bin engine`.
[profile.quick]
inherits = "release"
lto = false
codegen-units = 16
incremental = true

[profile.test]
opt-level = 1
debug = 0

[profile.wasm-release]
inherits = "release"
opt-level = "s"
strip = "debuginfo"
