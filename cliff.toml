# git-cliff ~ configuration file
# https://git-cliff.org/docs/configuration

[changelog]
# A Tera template to be rendered as the changelog's header.
# See https://keats.github.io/tera/#getting-started
header = """
# Mudcrab Changelog\n
All notable changes to Mudcrab will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).\n
"""
# A Tera template to be rendered for each release in the changelog.
# See https://keats.github.io/tera/#getting-started
body = """
{%- macro remote_url() -%}
  https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}
{%- endmacro -%}

{% if version -%}
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
    ## [Unreleased]
{% endif -%}

{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | upper_first }}
    {%- for commit in commits %}
        - {% if commit.breaking %}[**breaking**] {% endif %}{{ commit.message | split(pat="\n") | first | upper_first | trim }}\
            {% if commit.remote.username %} by @{{ commit.remote.username }}{%- endif -%}
            {% if commit.remote.pr_number %} in \
            [#{{ commit.remote.pr_number }}]({{ self::remote_url() }}/pull/{{ commit.remote.pr_number }}) \
            {%- endif -%}
            {%- if commit.breaking and commit.breaking_description and commit.breaking_description != commit.message %} \
            ⚠️ *{{ commit.breaking_description | trim }}*
            {%- endif -%}
    {% endfor %}
{% endfor %}

{%- if github.contributors | filter(attribute="is_first_time", value=true) | length != 0 %}
    ### 🛡️ New Adventurers
{%- endif -%}

{% for contributor in github.contributors | filter(attribute="is_first_time", value=true) %}
  * @{{ contributor.username }} made their first contribution to the realm\
    {%- if contributor.pr_number %} in \
      [#{{ contributor.pr_number }}]({{ self::remote_url() }}/pull/{{ contributor.pr_number }}) \
    {%- endif %}
{%- endfor %}\n

{%- if github.contributors | filter(attribute="is_first_time", value=true) | length != 0 %}{% raw %}\n{% endraw -%}{% endif %}

"""
# A Tera template to be rendered as the changelog's footer.
# See https://keats.github.io/tera/#getting-started
footer = """
{%- macro remote_url() -%}
  https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}
{%- endmacro -%}

{% for release in releases -%}
    {% if release.version and release.previous and release.previous.version -%}
        [{{ release.version | trim_start_matches(pat="v") }}]: \
            {{ self::remote_url() }}/compare/{{ release.previous.version }}...{{ release.version }}
    {% elif not release.version and release.previous and release.previous.version -%}
        [unreleased]: {{ self::remote_url() }}/compare/{{ release.previous.version }}...HEAD
    {% endif -%}
{% endfor %}
<!-- generated by git-cliff -->
"""
# Remove leading and trailing whitespaces from the changelog's body.
trim = true

[bump]
# Below 1.0.0 a breaking change (`!` title) bumps the minor, never to 1.0.0.
# 1.0.0 is a deliberate decision, not something a commit can trigger.
breaking_always_bump_major = false
features_always_bump_minor = true
initial_tag = "v0.1.0"

[git]
tag_pattern = "^v(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)(-([0-9A-Za-z.-]+))?(\\+([0-9A-Za-z.-]+))?$"
conventional_commits = true
filter_unconventional = false
commit_preprocessors = [
  { pattern = '\((\w+\s)?#([0-9]+)\)', replace = "" },
]
# Titles are enforced as Conventional Commits (see docs/contributing/writing-prs.md),
# so match on the type only. Commits that predate the rule fall into "Changed".
# Skips come first so they win over the group rules below.
commit_parsers = [
  { message = "^chore(\\(release\\))?!?: prepare", skip = true },
  { message = "^chore\\(deps[^)]*\\)", skip = true },
  { message = "^feat(\\([^)]*\\))?!?:", group = "Added" },
  { message = "^fix(\\([^)]*\\))?!?:", group = "Fixed" },
  { message = "^perf(\\([^)]*\\))?!?:", group = "Performance" },
  { message = "^docs(\\([^)]*\\))?!?:", group = "Documentation" },
  { message = "^test(\\([^)]*\\))?!?:", group = "Tests" },
  { message = "^revert(\\([^)]*\\))?!?:", group = "Removed" },
  { message = "^(refactor|style)(\\([^)]*\\))?!?:", group = "Changed" },
  { message = "^(chore|ci|build)(\\([^)]*\\))?!?:", group = "Tooling & CI" },
  { message = "^.*", group = "Changed" },
]
# Exclude commits that are not matched by any commit parser.
filter_commits = false
# Order releases topologically instead of chronologically.
topo_order = false
# Order of commits in each group/release within the changelog.
# Allowed values: newest, oldest
sort_commits = "newest"
