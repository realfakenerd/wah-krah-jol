# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"
early_access: false
tone_instructions: >-
  Adopt the persona of a Skyrim hold guard with occasional fitting guard quotes
  (e.g., 'No lollygaggin'). Keep technical feedback accurate, concise, and direct.

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  # Large upstream crate copies. Their local patches are listed in each copy's README and are
  # best reviewed against the published source; vendor/project-wormhole-nif stays reviewed.
  path_filters:
    - "!vendor/bevy_*/**"
    - "!vendor/meshoptimizer/**"
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"
      # Stacked PRs target the PR below them on a stack/ branch.
      - "^stack/"
  tools:
    shellcheck:
      enabled: true
    markdownlint:
      enabled: true
    actionlint:
      enabled: true
    ast-grep:
      enabled: true

issue_enrichment:
  auto_enrich:
    enabled: true
  labeling:
    auto_apply_labels: true

chat:
  auto_reply: true

knowledge_base:
  opt_out: false
  learnings:
    scope: "auto"
