[package]
name = "engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
collision-measure = []

[dependencies]
shared = { path = "../shared" }
bevy = { workspace = true, features = ["mesh_picking"] }
gltf = { version = "1.4", default-features = false }
wgpu = { version = "=29.0.4", default-features = false }
bevy_rapier3d = { version = "0.36.0", default-features = false, features = ["dim3", "debug-render-3d"] }
mlua.workspace = true
rusqlite.workspace = true
rkyv.workspace = true
memmap2.workspace = true
color-eyre.workspace = true
crossbeam-channel.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
ktx2.workspace = true
image = { version = "0.25.10", default-features = false, features = ["png"] }
libc = "0.2"
regex = "1.12"
time = { version = "0.3.55", features = ["formatting"] }
tracing = "0.1.44"
url = "2.5.8"
uuid = { version = "1.23.3", features = ["v4"] }
zip = { version = "9", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Com", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3.20"
# Used only by examples/model_inspector_export (the inspector GIF encoder), not by the engine.
gif = "=0.13.3"
converter = { path = "../converter" }
dummy-content = { path = "../dummy-content" }
ddsfile = "0.5"
# Compiles the terrain shaders in tests; the version Bevy 0.19's shader cache already builds.
# No default features: the "glsl" one makes naga_oil write every imported header in GLSL as well,
# which panics on Bevy's bindless material headers. Bevy turns on what it needs.
naga_oil = { version = "0.22", default-features = false }
